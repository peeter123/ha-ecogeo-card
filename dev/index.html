<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ecoGEO card emulator</title>
    <style>
      body {
        margin: 0;
        /* the same font as EMULATOR_FONT in dev/overlaps.ts */
        font-family: Roboto, 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        padding: 10px 16px;
        background: #fff;
        color: #212121;
        border-bottom: 1px solid #ccc;
      }
      .controls fieldset {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: center;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin: 0;
        padding: 4px 8px;
      }
      .controls label {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .controls output {
        display: inline-block;
        min-width: 5em;
      }
      #cards {
        padding: 16px;
      }
      .slot {
        width: 1000px; /* the default; preview.ts sets the width of the state */
      }
      .error {
        margin: 8px 0 0;
        padding: 8px 12px;
        border-left: 4px solid #db4437;
        background: var(--card-background-color);
        color: var(--primary-text-color);
        font-size: 12px;
        white-space: pre-wrap;
      }
      .error[hidden] {
        display: none;
      }
      body.light {
        --primary-background-color: #fafafa;
        --card-background-color: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #bdbdbd;
        --divider-color: rgba(0, 0, 0, 0.12);
        --secondary-background-color: #e5e5e5;
        color-scheme: light;
      }
      body.dark {
        --primary-background-color: #111111;
        --card-background-color: #1c1c1c;
        --primary-text-color: #e1e1e1;
        --secondary-text-color: #9b9b9b;
        --disabled-text-color: #6f6f6f;
        --divider-color: rgba(225, 225, 225, 0.12);
        --secondary-background-color: #282828;
        color-scheme: dark;
      }
    </style>
    <script type="module" src="./preview.ts"></script>
  </head>
  <body class="light">
    <form id="controls" class="controls" onsubmit="return false;"></form>
    <main id="cards"></main>
  </body>
</html>
