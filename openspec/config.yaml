schema: spec-driven

context: |
  A Home Assistant Lovelace card for Ecoforest ecoGEO heat pumps: the unit's internal hydraulic and refrigerant
  schematic, drawn by the card as inline SVG (never a background image), with live values beside each component
  and pipes coloured by temperature. Developed against one live installation (an ecoGEO B4 with an aerothermal
  outer loop, bridged by the ESPHome firmware in the separate repo esphome-ecoforest-ecogeo), but meant to be
  published on GitHub for others to install.

  This folder is its own git repo. A private Home Assistant config workspace elsewhere on the author's PC holds the
  deploy script, which uploads dist/ to /config/www/custom/ecogeo-card/ on the live host; files produced by a
  build tool are not uploaded automatically and need an explicit deploy. The card is a dashboard resource whose
  ?v= query must be bumped after every upload.

  Nothing installation-specific (entity IDs with serials, Lovelace resource ids, dashboard ids, hostnames) may ship
  in code or examples meant for others; installation notes belong in the git-ignored private/ folder only
  (private/installation.md). docs/ecogeo-card.md holds the public explanation. The live installation must keep
  working throughout every change; plan the migration of its dashboards.

  The card is read-only towards the heat pump: it calls no services and writes no entities; the only interaction
  is opening more-info.

  Sources of truth, and how artifacts cite them:
  - manual-figure: the ecoGEO technical service manual, section 3.1 "Component location" (item numbers 1-54, figures
    B1-B4 and C). Every drawn component and pipe cites its item number. Geometry follows the figure's topology,
    not its exact coordinates.
  - firmware-entity: entity names and units as exposed by the esphome-ecoforest-ecogeo firmware (default object
    ids <prefix>_<suffix>, prefix ecoforest_ecogeo). Default entity mapping follows this naming; every role stays
    overridable.
  - Registers.csv: refs/ecoforest-heatpump-registers/Registers.csv in that firmware repo, for meanings and value
    ranges of registers the firmware does not expose yet. Exposing a register is a firmware change, out of scope
    here.
  - derived: a state the card infers (operating mode, valve positions, active circuits). Every derived state
    names its inputs and is a pure, unit-tested function.

  Plain text only in names, labels and UI strings: no emoji.
  UI text keeps every number with its unit: a no-break space between them (NBSP in src/strings.ts), never a plain
  space, so no card width breaks a line between a value and its unit.
  Shared helpers come from the hrv-ventilation repo by copy, never by import or path reference: the repos must not
  depend on each other.

  Implementation workflow (binding, not advisory): the session that runs apply is the orchestrator. It never
  edits implementation files itself (src, test, dev, scripts, config files, docs written by tasks), not even for a
  spike or a one-line fix. Every task is implemented, and every review finding fixed, by a subagent launched with
  the Agent tool using subagent_type general-purpose and model "sonnet" (Sonnet 5.5). Never use a fork for this: a
  fork always runs on the orchestrator's model and ignores the model setting. One subagent per task group; never
  brief a subagent with more than one group. Every task group ends with a review on Opus: an Agent-tool subagent
  with subagent_type general-purpose and model "opus" (Opus 5.5), whatever model the orchestrator runs on. It
  runs the group's validation (npm run check once it exists) and edits nothing.

  Review loop. Round 1 is a fresh Opus review of the group's whole diff against its tasks, design and spec
  scenarios. It reports every finding in that one report, ranked blocking, should-fix or nit, and lists decision
  points (spec or design gaps, choices for the user) separately. Decision points are settled in the planning
  artifacts, by the orchestrator or by the user, before any fix. A Sonnet subagent, preferably the resumed
  implementer, then fixes the findings; it adds no behaviour beyond them, and a fix that needs new design is a
  decision point. A fix that redesigns the operating-mode logic or the drawing's geometry model goes to an Opus
  subagent at effort high instead. Round 2 and later resume the round 1 reviewer (SendMessage), or brief a new
  Opus reviewer with the previous report and the fix diff. It checks that each finding is fixed and reviews only
  the changed hunks for regressions; it raises anything outside the fix only if it is blocking, and applies no
  new standards. A review with no blocking or should-fix finding is clean. Nits from the last round are fixed by
  a Sonnet subagent and checked by the orchestrator (the diff and npm run check) without another review.
  Formatting is not a review finding; Prettier and the quality hook check it. After round 3 the orchestrator
  stops and asks the user. Before a change is archived, one fresh Opus review covers the whole change. A group is
  done only after a clean review. The orchestrator may edit only planning artifacts (proposal, design, specs,
  tasks notes) and workspace instructions.

  Every task group gets its own commit. After the clean Opus review, the orchestrator commits that group alone:
  its implementation files and its tasks.md check-offs, staged by explicit path (never git add -A or git add .),
  leaving unrelated working-tree changes unstaged and private/ ignored. One commit per group: never batch groups,
  split a group across commits, amend an earlier group's commit, or push. The message has an imperative subject
  line and a body that starts "Group <n> of <change-id>:" and summarizes what the group delivered. This rule is
  the user's standing authorization for exactly these commits.

  Visual verification: screenshots (dev emulator or live dashboard) are captured and inspected by subagents, which
  return a text verdict. The orchestrator opens an image only when the user asks or the verdict is unclear.
  Live-installation steps (uploading, bumping the resource, changing a dashboard) follow the workspace's rules
  for live changes.

  Releases: the card is distributed through HACS as a custom repository (hacs.json, GitHub releases carrying
  dist/ecogeo-card.js). A change's release group bumps the version in package.json (minor for new behaviour, patch
  for fixes), adds the version's CHANGELOG.md entry and runs npm run release. Pushing, tagging and creating the
  GitHub release happen only when the user explicitly asks for that release; the "never push" above stays the
  default for task groups. npm run check includes npm run lint:ha (codespell, yamllint, the workflow schema and the
  Markdown format check, see docs/ecogeo-card.md), and the CI workflows in .github/workflows/ repeat the checks.

rules:
  proposal:
    - State explicitly what is out of scope and which follow-up change (or firmware repo change) covers it.
    - Mark each entity, register or component fact as manual-figure, firmware-entity, Registers.csv or derived.
    - State whether the change touches the live installation (deploy, resource, dashboard) and how.
  design:
    - Cite the manual item number behind every drawn component and pipe, and the inputs behind every derived state.
    - For every helper copied from hrv-ventilation, name its source file and any deviation.
  specs:
    - Write scenarios that a unit test or an emulator screenshot can check; no scenario depends on the live unit.
  tasks:
    - >-
      Organize tasks into numbered groups (## 1., ## 2., ...) that can each be implemented and reviewed in a fresh
      session, relying only on the change artifacts and the repository.
    - >-
      Size each task group as one coherent commit that leaves the repository consistent (npm run check passes once it
      exists); do not add commit tasks, since the apply workflow commits each group.
    - >-
      Include verification in the dev emulator (agent screenshot and verdict) for every visible change, and on the live
      installation (agent screenshot plus state check) once the card is deployed.
    - Include updating README.md and docs/ecogeo-card.md for every behaviour change.
    - >-
      End a change that alters the shipped card with a release group: bump the version in package.json, add the
      CHANGELOG.md entry, run npm run release (dist/ecogeo-card.js is committed). The push, tag and GitHub release are
      not tasks unless the user asked for that release when the change was planned (as for add-hacs-release); either
      way they run only on the user's explicit request.

operations:
  apply:
    guidance:
      - >-
        Read AGENTS.md before editing; run implementation sessions from this folder so the quality hook and /opsx
        commands load.
      - Check git status first and preserve unrelated working-tree changes.
      - >-
        Work one task group at a time, starting at the first group in tasks.md with unchecked tasks. tasks.md is the
        only progress state carried between sessions.
      - >-
        Delegate all implementation to a subagent running the Sonnet model (Agent tool, subagent_type general-purpose,
        model "sonnet"; never a fork). Never edit implementation files yourself; your role is to brief the subagent and
        review its work. This is binding; see "Implementation workflow" in context.
      - >-
        Brief the subagent with the change id, the task group, the relevant proposal/design/spec excerpts, AGENTS.md and
        the rules above (NBSP, no emoji, nothing installation-specific, read-only card, docs in sync). Instruct it to
        keep the quality hook green and to check off completed tasks in tasks.md only after npm run check passes (once
        it exists).
      - >-
        Review only once the whole group is done, through a review subagent on Opus (subagent_type general-purpose,
        model "opus", read-only) that reads the diff against the group's tasks and specs and runs npm run check. Follow
        the "Review loop" in context: round 1 reports every finding ranked blocking, should-fix or nit; settle decision
        points in the plan before fixing; later rounds check only the fix diff; clean means no blocking or should-fix
        finding; stop and ask the user after round 3.
      - >-
        After the group passes review, commit it as its own commit (see "Implementation workflow" in context: explicit
        paths only, the group's tasks.md check-offs included, no push).
      - >-
        After the commit, report a short summary with the commit hash and stop. Do not start the next group. Tell the
        user to run /clear and re-run apply to continue with the next group.
