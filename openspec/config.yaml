# constitution: 2026-11-23
schema: spec-driven

context: |
  A Home Assistant Lovelace card for Ecoforest ecoGEO heat pumps: the unit's internal hydraulic and refrigerant
  schematic, drawn by the card as inline SVG (never a background image), with live values beside each component
  and pipes coloured by temperature. Developed against one live installation (an ecoGEO B4 with an aerothermal
  outer loop, bridged by the ESPHome firmware in the separate repo esphome-ecoforest-ecogeo), but meant to be
  published on GitHub and installed through HACS by others.

  This folder is its own git repo; its files never reference paths outside it. Nothing installation-specific
  (entity IDs with serials, Lovelace resource ids, dashboard ids, hostnames, IPs, tokens) may ship in code, tests,
  examples or docs meant for others; installation notes belong in the git-ignored private/ folder only
  (private/installation.md). How to deploy to the live installation is in private/installation.md: dist/ is
  uploaded only by an explicit deploy, and the dashboard resource's ?v= query is bumped after every upload.

  Safety: never deploy, change a Lovelace resource or dashboard of the live installation, restart Home Assistant,
  commit, push, tag or release without explicit user authorization. The standing exceptions are the
  planning-artifact commit and the per-group commit below; they never extend to pushing. The live installation
  must keep working throughout every change; plan the migration of its dashboards. The card is read-only towards
  the heat pump: it calls no services and writes no entities; the only interaction is opening more-info.

  Never read or print .env files or Home Assistant tokens; scripts read them themselves. Tests and the dev
  emulator use synthetic data only; fixtures built from real history replace every identifier with a made-up one.

  Sources of truth, and how artifacts cite them:
  - manual-figure: the ecoGEO technical service manual, section 3.1 "Component location" (item numbers 1-54,
    figures B1-B4 and C). Every drawn component and pipe cites its item number. Geometry follows the figure's
    topology, not its exact coordinates.
  - firmware-entity: entity names and units as exposed by the esphome-ecoforest-ecogeo firmware (default object
    ids <prefix>_<suffix>, prefix ecoforest_ecogeo). Default entity mapping follows this naming; every role stays
    overridable.
  - Registers.csv: refs/ecoforest-heatpump-registers/Registers.csv in that firmware repo, for meanings and value
    ranges of registers the firmware does not expose yet. Exposing a register is a firmware change, out of scope
    here.
  - derived: a state or value the card infers (operating mode, valve positions, active circuits, COP). Every
    derived value names its inputs and is a pure, unit-tested function.
  Verify every external API against its pinned source, not memory.

  Tooling: tools run from the exact versions locked in package-lock.json, through the npm scripts; the Home
  Assistant quality checks (npm run lint:ha) run codespell, yamllint and check-jsonschema through uvx at exact
  versions. Nothing is taken from PATH beyond Node.js, npm and uv. Validation: npm run check (typecheck, lint,
  format check, lint:ha, unit and browser tests); npm run test:visual for the pixel references, compared on CI
  Linux only. Check exit codes. Generated files are never edited by hand: dist/ is written only by
  npm run release, build/ only by npm run build, .agents/ and .claude/skills/ only by openspec update.

  Plain text only in names, labels and UI strings: no emoji. UI text keeps every number with its unit: a no-break
  space between them (NBSP in src/strings.ts), never a plain space, so no card width breaks a line between a value
  and its unit. Shared helpers come from the hrv-ventilation repo by copy, never by import or path reference: the
  repos must not depend on each other.

  Documentation: README.md is the entry point (features, install, configuration) and docs/ecogeo-card.md the
  public explanation; both describe the current state. Every behaviour change updates the docs in the same task
  group; superseded text is removed; no line-number citations.

  Releases: the card is distributed through HACS as a custom repository (hacs.json, GitHub releases carrying
  dist/ecogeo-card.js). A change's release group bumps the version in package.json (minor for new behaviour, patch
  for fixes), adds the version's CHANGELOG.md entry and runs npm run release. Pushing, tagging and creating the
  GitHub release happen only when the user explicitly asks for that release. The CI workflows in .github/workflows/
  repeat the checks.

  Before a task group starts, uncommitted changes in openspec/changes/<change-id>/ get a commit of their own,
  staged by explicit path: subject "Add planning artifacts for <change-id>" the first time, "Update planning
  artifacts for <change-id>" after that, and a body that says what changed. This covers the start of apply and
  changes made between groups; artifact edits made during a group go into that group's commit and are named in its
  body.

  Every task group gets its own commit, after its validation passes and its review is clean: its implementation
  files and its tasks.md check-offs, staged by explicit path (never git add -A or git add .), leaving unrelated
  working-tree changes unstaged and private/ ignored. Never batch groups, split a group across commits, amend an
  earlier group's commit, or push. The message has an imperative subject line and a body that starts
  "Group <n> of <change-id>:" and summarizes what the group delivered.

rules:
  proposal:
    - State explicitly what is out of scope and which follow-up change (or firmware repo change) covers it.
    - Mark each external fact with its source tag (manual-figure, firmware-entity, Registers.csv, derived).
    - State whether the change touches the live installation (deploy, resource, dashboard), and how.
    - >-
      For new capability, name the existing tools, libraries or components that were checked, and why each is used
      or not. Build new only when none fits.
  design:
    - >-
      Cite the source (file and function, or document) behind every decision that depends on an external API, and
      the manual item number behind every drawn component and pipe.
    - Name the inputs of every derived value and where its pure function lives.
    - For every helper copied from hrv-ventilation, name its source file and any deviation.
  specs:
    - >-
      Write scenarios that a unit test, a browser test or an emulator screenshot can check offline, or that name the
      live check explicitly; no scenario depends on installation-specific identifiers.
  tasks:
    - >-
      Organize tasks into numbered groups (## 1., ## 2., ...) that can each be implemented and reviewed in a fresh
      session, relying only on the change artifacts and the repository.
    - >-
      Size each task group as one coherent commit that leaves the repository consistent (npm run check passes); do
      not add commit tasks, since the apply workflow commits each group.
    - >-
      Update README.md and docs/ecogeo-card.md in the group that changes behaviour; never collect docs into a final
      group.
    - >-
      Include verification in the dev emulator (a screenshot and its verdict) for every visible change, and on the
      live installation (a screenshot plus a state check) once the card is deployed.
    - >-
      End a change that alters the shipped card with a release group: bump the version in package.json, add the
      CHANGELOG.md entry, run npm run release (dist/ecogeo-card.js is committed). The push, tag and GitHub release are
      not tasks unless the user asked for that release when the change was planned; either way they run only on the
      user's explicit request.
    - >-
      Mark live steps (deploy, resource bump, dashboard change) with their required authorization, and put them in a
      final group.

operations:
  apply:
    guidance:
      - >-
        Read AGENTS.md before editing; run sessions from this folder so the quality hook and the OpenSpec skills
        load.
      - Check git status first and preserve unrelated working-tree changes.
      - >-
        Work one task group at a time, starting at the first group in tasks.md with unchecked tasks. tasks.md is the
        only progress state carried between sessions.
      - >-
        Before each group, commit uncommitted changes to the change's planning artifacts first, as described in
        context.
      - Keep the quality hook green; fix what it reports before moving on.
      - Check off completed tasks in tasks.md only after npm run check passes.
      - Commit each group as described in context; never push.
