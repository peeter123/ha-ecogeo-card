name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      update_references:
        description: Record the visual references again and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Check and verify dist
    # The visual references in test/visual/references/ were recorded on this image (run 44796692252, image
    # 20261116.202.1); a newer Ubuntu can shift glyph pixels, so moving up means recording them again through the
    # update_references input.
    runs-on: ubuntu-26.04
    # The job and the Playwright step allow extra time: the system packages come from a mirror that is sometimes slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
      - run: npm ci
      - name: Install the Playwright browsers
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 20
      - name: Install the Roboto font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-roboto
      - run: npm run check
      # A missing reference fails here: on CI Vitest fails a comparison that has no reference and writes the image
      # only to the attachments folder. Record the references again through the update_references input.
      - name: Compare the visual references
        if: ${{ !inputs.update_references }}
        run: npm run test:visual
      - name: Upload the visual diffs
        if: ${{ failure() && !inputs.update_references }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: .vitest/attachments/
          if-no-files-found: ignore
      - name: Record the visual references
        if: ${{ inputs.update_references }}
        run: npm run test:visual -- --update
      - name: Upload the visual references
        if: ${{ inputs.update_references }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-references
          path: test/visual/references/
          if-no-files-found: error
      - run: npm run verify-dist
