name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and verify dist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Install the Roboto font
        run: sudo apt-get install -y --no-install-recommends fonts-roboto
      - run: npm run check
      - run: npm run verify-dist
